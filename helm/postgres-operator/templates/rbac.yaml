{{- /*
RBAC for postgres-operator.
ServiceAccount + namespaced Role + RoleBinding.

Namespaced, not cluster-scoped: main.py runs kopf.run(clusterwide=False), so
the operator only ever watches/manages resources in its own release
namespace. A ClusterRole here would grant it read/write on Secrets and PVCs
in every namespace in the cluster for no operational benefit — pure blast
radius with no corresponding capability.

The operator manages: ManagedPostgres + PostgresRestore CRs (including
status subresource and finalizers), and child resources: Secrets, PVCs,
StatefulSets, Services, CronJobs, Jobs — all within this namespace.
*/ -}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgres-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "postgres-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-operator.labels" . | nindent 4 }}
rules:
  # Custom resources: full lifecycle + status + finalizers.
  # - status: kopf writes .status via the status subresource.
  # - finalizers: operator adds/removes db.harshdev.io/finalizer.
  # - create on postgresrestores: auto-restore creates PostgresRestore CRs.
  - apiGroups: ["db.harshdev.io"]
    resources: ["managedpostgres", "postgresrestores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["db.harshdev.io"]
    resources: ["managedpostgres/status", "postgresrestores/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["db.harshdev.io"]
    resources: ["managedpostgres/finalizers"]
    verbs: ["update", "patch"]
  # Child resources owned by ManagedPostgres.
  # - persistentvolumeclaims: includes the ownerless backup-data PVC.
  # - jobs: backup/restore/final-backup Jobs (orphans included).
  - apiGroups: [""]
    resources: ["secrets", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only: sync_backup_status() reads the backup pod's termination message
  # (backup file count) to fill in status.backupCount and the backup metrics.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # k8s Events: emit_event() in main.py posts them directly, and kopf itself
  # posts handler warnings/errors here (settings.posting.level). Without this
  # rule every one of those posts 403s (caught and logged, but noisy/useless).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "postgres-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "postgres-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "postgres-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
