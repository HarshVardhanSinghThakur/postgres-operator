apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresrestores.db.harshdev.io
spec:
  group: db.harshdev.io
  scope: Namespaced
  names:
    plural: postgresrestores
    singular: postgresrestore
    kind: PostgresRestore
    shortNames:
      - pgr
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["targetDatabase", "backupFile"]
              properties:
                targetDatabase:
                  type: string
                  description: "Name of the ManagedPostgres to restore into"
                backupFile:
                  type: string
                  description: "Backup filename to restore from"
            status:
              type: object
              properties:
                phase:
                  type: string   # Pending | Running | Completed | Failed
                message:
                  type: string
                startTime:
                  type: string
                completionTime:
                  type: string
